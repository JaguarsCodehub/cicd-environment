name: CI/CD Multi-Environment Pipeline

on:
  push:
    branches:
      - dev
      - staging
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # CI: BUILD ONCE & TEST ARTIFACT
  # ==========================================================
  ci:
    name: Build & Test Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Unit Test Suite
        run: npm test

      - name: Execute Integration Test Suite
        run: npm run test:integration

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Immutable Docker Image
        run: |
          docker build \
            --tag app:${{ github.sha }} \
            --tag app:latest .

      - name: Export Docker Image Artifact
        run: |
          mkdir -p dist
          docker save app:${{ github.sha }} -o dist/app-image.tar

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-artifact
          path: dist/app-image.tar
          retention-days: 7

  # ==========================================================
  # DEPLOY: DEVELOPMENT TIER (Automatic on 'dev' branch)
  # ==========================================================
  deploy-dev:
    name: Deploy to Development
    needs: ci
    if: github.ref == 'refs/heads/dev'
    environment:
      name: development
      url: ${{ secrets.EC2_HOST && format('http://{0}:3001', secrets.EC2_HOST) || 'http://localhost:3001' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: dist

      - name: Deploy to Target (AWS EC2 / Runner)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -n "$EC2_HOST" ] && [ -n "$EC2_SSH_KEY" ]; then
            echo "Deploying remotely to AWS EC2: $EC2_HOST (Environment: dev, Port: 3001)..."
            mkdir -p ~/.ssh
            echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            chmod +x scripts/remote-deploy.sh
            ./scripts/remote-deploy.sh dev "$EC2_HOST" "$EC2_USER"
          else
            echo "EC2_HOST secret not configured. Executing container deployment on GitHub runner..."
            docker load -i dist/app-image.tar
            docker compose --profile dev up -d
            timeout 30 bash -c 'until curl -s -f http://localhost:3001/health; do sleep 2; done'
            node scripts/smoke-test.js http://localhost:3001
          fi

  # ==========================================================
  # DEPLOY: STAGING TIER (Automatic on 'staging' branch)
  # ==========================================================
  deploy-staging:
    name: Deploy to Staging
    needs: ci
    if: github.ref == 'refs/heads/staging'
    environment:
      name: staging
      url: ${{ secrets.EC2_HOST && format('http://{0}:3002', secrets.EC2_HOST) || 'http://localhost:3002' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: dist

      - name: Deploy to Target (AWS EC2 / Runner)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -n "$EC2_HOST" ] && [ -n "$EC2_SSH_KEY" ]; then
            echo "Deploying remotely to AWS EC2: $EC2_HOST (Environment: staging, Port: 3002)..."
            mkdir -p ~/.ssh
            echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            chmod +x scripts/remote-deploy.sh
            ./scripts/remote-deploy.sh staging "$EC2_HOST" "$EC2_USER"
          else
            echo "EC2_HOST secret not configured. Executing container deployment on GitHub runner..."
            docker load -i dist/app-image.tar
            docker compose --profile staging up -d
            timeout 30 bash -c 'until curl -s -f http://localhost:3002/health; do sleep 2; done'
            node scripts/smoke-test.js http://localhost:3002
          fi

  # ==========================================================
  # DEPLOY: PRODUCTION TIER (Manual Approval Gate on 'main' branch)
  # ==========================================================
  deploy-prod:
    name: Deploy to Production
    needs: ci
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ secrets.EC2_HOST && format('http://{0}:3000', secrets.EC2_HOST) || 'http://localhost:3000' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: dist

      - name: Deploy to Target (AWS EC2 / Runner)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -n "$EC2_HOST" ] && [ -n "$EC2_SSH_KEY" ]; then
            echo "Deploying remotely to AWS EC2: $EC2_HOST (Environment: prod, Port: 3000)..."
            mkdir -p ~/.ssh
            echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            chmod +x scripts/remote-deploy.sh
            ./scripts/remote-deploy.sh prod "$EC2_HOST" "$EC2_USER"
          else
            echo "EC2_HOST secret not configured. Executing container deployment on GitHub runner..."
            docker load -i dist/app-image.tar
            docker compose --profile prod up -d
            timeout 30 bash -c 'until curl -s -f http://localhost:3000/health; do sleep 2; done'
            node scripts/smoke-test.js http://localhost:3000
          fi
